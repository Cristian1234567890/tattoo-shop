<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="darkPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hex/Circle Badge -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#darkPlate)" stroke="url(#primaryGrad)" stroke-width="3" />
  
  <!-- Outer Tech Halo Ring -->
  <circle cx="60" cy="56" r="40" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4" />
  
  <!-- Rotary Motor / Machine Frame -->
  <circle cx="60" cy="38" r="16" fill="#18181B" stroke="url(#primaryGrad)" stroke-width="2.5" />
  <circle cx="60" cy="38" r="8" fill="url(#primaryGrad)" />
  <circle cx="60" cy="38" r="3" fill="#FFFFFF" />

  <!-- Frame Side Braces -->
  <path d="M48 40 L38 52 L42 66 L52 64" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M72 40 L82 52 L78 66 L68 64" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Grip / Tube Section -->
  <rect x="53" y="62" width="14" height="22" rx="3" fill="#27272A" stroke="url(#primaryGrad)" stroke-width="2" />
  <!-- Grip Grooves -->
  <line x1="53" y1="67" x2="67" y2="67" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.8" />
  <line x1="53" y1="72" x2="67" y2="72" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.8" />
  <line x1="53" y1="77" x2="67" y2="77" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.8" />

  <!-- Needle Tip & Blade -->
  <path d="M57 84 L63 84 L60 102 Z" fill="url(#accentGrad)" filter="url(#glow)" />
  <line x1="60" y1="54" x2="60" y2="102" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />

  <!-- Ink Splash / Star Sparkle Accent -->
  <circle cx="78" cy="30" r="2" fill="#EC4899" />
  <circle cx="40" cy="32" r="1.5" fill="#8B5CF6" />
  <circle cx="60" cy="105" r="2" fill="#EC4899" filter="url(#glow)" />
</svg>
